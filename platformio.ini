[platformio]
default_envs = seeed_xiao_esp32s3

[env]
platform = espressif32@6.12.0
framework = arduino
lib_ldf_mode = deep+
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    zinggjm/GxEPD2 @ ^1.5.0
    mathertel/OneButton @ ^2.0.3
    bblanchon/ArduinoJson @ ^6.21.3
    esphome/ESPAsyncWebServer-esphome @ ^3.1.0
    esphome/AsyncTCP-esphome @ ^2.0.0
    tzapu/WiFiManager @ ^2.0.17
    bitbank2/unzipLIB @ ^1.0.0
    bitbank2/PNGdec @ 1.1.6
    https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
    bitbank2/bb_epaper @ ^2.1.7
    https://github.com/thijse/Arduino-Log.git
    h2zero/NimBLE-Arduino @ 1.4.3
build_flags =
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3
    -D PNG_MAX_BUFFERED_PIXELS=16416
    -I include
    ; bb_epaper includes SPI from an .inl file that PlatformIO's dependency
    ; scanner cannot see, so expose the bundled framework header explicitly.
    -I $PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/SPI/src
board_build.filesystem = littlefs

[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3
lib_ignore = FastEPD

; Seeed XIAO S3 High-Spec (16MB Flash, 8MB PSRAM)
board_build.partitions = partitions_16MB.csv
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_SEEED_XIAO_ESP32S3

; LittleFS uploadfs targets the 1MB "spiffs" web partition. The separate
; 10MB "ebooks" partition is mounted by InkDeck at runtime.

[env:seeed_reterminal_sticky]
board = esp32-s3-devkitc-1
lib_ignore = FastEPD

; Seeed reTerminal E1002 / Sticky (32MB Flash, 8MB PSRAM)
board_build.partitions = partitions_32MB_sticky.csv
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.flash_size = 32MB
; Sticky's 32MB QSPI flash is booted conservatively in DIO mode. QIO causes
; early ROM watchdog resets on production hardware before the second-stage
; bootloader can finish loading. PSRAM remains octal.
board_build.flash_mode = dio
board_build.psram_type = opi
board_build.arduino.memory_type = dio_opi
build_flags =
    ${env.build_flags}
    -D BOARD_SEEED_STICKY

; The Sticky uses its MicroSD card for ebook storage when present and falls
; back to the internal "ebooks" LittleFS partition when no card is mounted.

; Experimental: newer H752-01 / Pro Lite, NOT the older H752.
[env:lilygo_t5s3_pro]
platform = espressif32@6.12.0
build_unflags = -Os
board = esp32-s3-devkitc-1
board_build.partitions = partitions_16MB_lilygo.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
build_flags =
    ${env.build_flags}
    -D BOARD_LILYGO_T5S3_PRO
    -O3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; LILYGO T5 S3 Pro H752-01 + audio: Audiobookshelf, the external USB-C audio
; module (M5Stack ATOM Lite running bigonionbots/atom-lite-audio-module) and
; USB Audio Class 1.0 headphone adapters (tested: Sabrent AU-UCMA). Ported
; from bigonionbots/inx-pro (env t5s3_audio); see lib/Book32_Audio/README.md.
; The USB host and UAC drivers need ESP-IDF 5.5, so this env alone runs on
; Arduino-ESP32 3.3.7 (pioarduino); every other env stays on espressif32@6.12.0.
[env:lilygo_t5s3_pro_audio]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
; Its own copy of the core (tools/fetch_arduino3.sh): espressif32 6.12.0 would
; otherwise swap the shared global framework package back to 2.0.17.
platform_packages =
    framework-arduinoespressif32 @ symlink://${sysenv.HOME}/.platformio/frameworks/arduino-esp32-3.3.7
build_unflags = -Os
board = esp32-s3-devkitc-1
board_build.partitions = partitions_16MB_lilygo.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
; PNGdec and unzipLIB both bundle zlib, and FastEPD and bb_epaper both carry
; Group5: archived libraries let the linker take one copy, as espressif32 6.x does.
lib_archive = yes
; The esphome AsyncTCP / AsyncWebServer forks predate Arduino 3; ESP32Async's
; are their maintained successors with the same API.
lib_deps =
    zinggjm/GxEPD2 @ ^1.5.0
    mathertel/OneButton @ ^2.0.3
    ; The audio backend is written for ArduinoJson 7, which still takes v6's API.
    bblanchon/ArduinoJson @ 7.4.2
    ESP32Async/ESPAsyncWebServer @ 3.7.10
    ESP32Async/AsyncTCP @ 3.4.5
    tzapu/WiFiManager @ ^2.0.17
    bitbank2/unzipLIB @ ^1.0.0
    bitbank2/PNGdec @ 1.1.6
    https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
    bitbank2/bb_epaper @ ^2.1.7
    https://github.com/thijse/Arduino-Log.git
    h2zero/NimBLE-Arduino @ 1.4.3
    Book32_Audio
    ; USB host stack built from source (larger control transfers for the
    ; Sabrent's 519-byte descriptor), serial bridge and UAC class drivers, and
    ; the AAC decoder; all vendored unmodified under third_party/.
    esp_idf_usb=symlink://third_party/usb_host/esp_idf_usb
    usb_host_cdc_acm=symlink://third_party/usb_host/usb_host_cdc_acm
    usb_host_ch34x_vcp=symlink://third_party/usb_host/usb_host_ch34x_vcp
    usb_host_cp210x_vcp=symlink://third_party/usb_host/usb_host_cp210x_vcp
    usb_host_ftdi_vcp=symlink://third_party/usb_host/usb_host_ftdi_vcp
    usb_host_uac=symlink://third_party/usb_host/usb_host_uac
    opencore_aacdec=symlink://third_party/opencore_aacdec
; Not ${env.build_flags}: its SPI include path names the shared 2.0.17 package.
build_flags =
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3
    -D PNG_MAX_BUFFERED_PIXELS=16416
    -I include
    -I ${sysenv.HOME}/.platformio/frameworks/arduino-esp32-3.3.7/libraries/SPI/src
    ; Arduino 3 moved WiFi's base classes into the Network library, which
    ; deep+ scanning does not hand to libraries such as AsyncTCP.
    -I ${sysenv.HOME}/.platformio/frameworks/arduino-esp32-3.3.7/libraries/Network/src
    -I ${sysenv.HOME}/.platformio/frameworks/arduino-esp32-3.3.7/libraries/FS/src
    ; ESPAsyncWebServer builds AsyncJson only when it can see ArduinoJson.
    -I ${PROJECT_LIBDEPS_DIR}/${PIOENV}/ArduinoJson/src
    -D BOARD_LILYGO_T5S3_PRO
    -D INKDECK_AUDIO=1
    ; The audio backend keeps its original INX_* switches.
    -D INX_HAS_AUDIO_MODULE=1
    -I shared/audio_link
    ; Bridge baud rate; the module firmware's AUDIO_MODULE_BAUD must match. The
    ; ATOM Lite's FTDI-emulating bridge garbles 921600 and 1M.
    -D INX_AUDIO_MODULE_BAUD=500000
    ; Kconfig options of the vendored usb_host_uac driver, which the prebuilt
    ; sdkconfig lacks. 4 transfers of 4 ms keep 16 ms queued on the bus.
    -D CONFIG_UAC_DEV_ADDR_LIST_MAX=6
    -D CONFIG_UAC_FREQ_NUM_MAX=4
    -D CONFIG_UAC_NUM_ISOC_URBS=4
    -D CONFIG_UAC_NUM_PACKETS_PER_URB=4
    -D CONFIG_UAC_RINGBUF_SAFE_DELETE_WAITING_MS=50
    -O3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
